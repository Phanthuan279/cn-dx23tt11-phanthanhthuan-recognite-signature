[project]
name = "sigverify"
version = "0.1.0"
description = "Offline handwritten signature verification with a writer-independent Siamese network"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
